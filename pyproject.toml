[tool.poetry]
name = "emg-causal-decoding"
version = "0.1.0"
description = "Cross-subject EMG decoding: causal structure discovery (DYNOTEARS/VAR-LiNGAM) + invariant causal prediction vs. statistical baselines"
authors = ["Vernon D'Souza <vernon.dsouza123@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
numpy = ">=1.24,<2.0"
scipy = "^1.13"
pandas = "^2.2"
scikit-learn = "^1.5"
matplotlib = "^3.10"
statsmodels = "^0.14"
lingam = "^1.13.0"
gcastle = "^1.0.4"
networkx = "^3.3"
h5py = "^3.11"
mat73 = "^0.65"
tqdm = "^4.66"
requests = "^2.32"
pywavelets = "^1.8.0"
causalicp = "^0.1.1"
xgboost = "^2.1.0"
dowhy = "0.11.1"
pydot = "<3"
seaborn = "^0.13.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
jupyter = "^1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
